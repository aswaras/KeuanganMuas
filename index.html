<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KeuanganKu Cloud</title>
  <meta name="theme-color" content="#10b981" id="meta-theme-color">
  
  <!-- PWA Meta Tags -->

  <style>
    /* CSS Variables for Dynamic Theming */
    :root {
      --color-primary-50: #ecfdf5;
      --color-primary-100: #d1fae5;
      --color-primary-200: #a7f3d0;
      --color-primary-300: #6ee7b7;
      --color-primary-400: #34d399;
      --color-primary-500: #10b981;
      --color-primary-600: #059669;
      --color-primary-700: #047857;
      --color-primary-900: #064e3b;
    }
    .theme-blue {
      --color-primary-50: #eff6ff; --color-primary-100: #dbeafe; --color-primary-200: #bfdbfe;
      --color-primary-300: #93c5fd; --color-primary-400: #60a5fa; --color-primary-500: #3b82f6;
      --color-primary-600: #2563eb; --color-primary-700: #1d4ed8; --color-primary-900: #1e3a8a;
    }
    .theme-purple {
      --color-primary-50: #f5f3ff; --color-primary-100: #ede9fe; --color-primary-200: #ddd6fe;
      --color-primary-300: #c4b5fd; --color-primary-400: #a78bfa; --color-primary-500: #8b5cf6;
      --color-primary-600: #7c3aed; --color-primary-700: #6d28d9; --color-primary-900: #4c1d95;
    }

    body { margin: 0; padding: 0; background-color: #f3f4f6; overflow: hidden; -webkit-tap-highlight-color: transparent; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .dark body { background-color: #111827; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .loader { border-top-color: var(--color-primary-500); -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { 
        extend: { 
          colors: { 
            primary: { 
              50: 'var(--color-primary-50)', 100: 'var(--color-primary-100)', 200: 'var(--color-primary-200)',
              300: 'var(--color-primary-300)', 400: 'var(--color-primary-400)', 500: 'var(--color-primary-500)', 
              600: 'var(--color-primary-600)', 700: 'var(--color-primary-700)', 900: 'var(--color-primary-900)' 
            } 
          } 
        } 
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

</head>
<body class="theme-emerald"> <!-- Default theme -->

  <div id="root"></div>

  <script>
    // ==========================================
    // KONFIGURASI DATABASE GOOGLE APPS SCRIPT
    // ==========================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxwjUOCFw2fR_Kq2Md1KzKNG93Nqqe1JFjj9_lGqXgZZgzyDd48AU6EXWD04nTTVCnGAA/exec";

    // Keys untuk Local Storage (Offline Database)
    const LS_KEYS = { TX: 'keuanganku_tx', DEBT: 'keuanganku_debt', CONTACT: 'keuanganku_contact', QUEUE: 'keuanganku_queue', SETTINGS: 'keuanganku_settings' };

    const e = React.createElement;
    const { useState, useEffect, useMemo, useRef } = React;

    // --- KOMPONEN IKON SVG ---
    const Icon = ({ name, size = 24, className = "" }) => {
      const paths = {
        home: "M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6",
        wallet: "M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z",
        users: "M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z",
        settings: "M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z|M15 12a3 3 0 11-6 0 3 3 0 016 0z",
        plus: "M12 4v16m8-8H4",
        minus: "M20 12H4",
        arrowUp: "M7 17L17 7m0 0H8m9 0v9",
        arrowDown: "M17 7l-10 10m0 0h9m-9 0V8",
        calendar: "M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z",
        download: "M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4",
        upload: "M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12",
        chevronLeft: "M15 19l-7-7 7-7",
        sun: "M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z",
        moon: "M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z",
        database: "M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4",
        check: "M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z",
        pieChart: "M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z|M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z",
        cloud: "M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z",
        cloudOff: "M22.11 21.46L2.39 1.73 1.11 3l2.91 2.91A4.98 4.98 0 003 15h12.11l3.73 3.73 1.27-1.27zM5 15a3 3 0 01-.13-5.99L6.59 10.7A5.003 5.003 0 0014 13h1v2H5zM17 15h2a4 4 0 00-3.32-6.93 5.003 5.003 0 00-7.85-.75L9.69 9.1A3.003 3.003 0 0116.5 11h.5a2 2 0 012 2v.11l-2-2V15z"
      };
      const pathStrings = paths[name].split('|');
      return e('svg', { className, width: size, height: size, fill: "none", viewBox: "0 0 24 24", stroke: "currentColor" },
        pathStrings.map((d, i) => e('path', { key: i, strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d }))
      );
    };

    // --- UTILITAS & FORMATTING ---
    const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
    const formatNumberInput = (val) => val.toString().replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const parseNumberInput = (val) => parseInt(val.toString().replace(/\./g, ''), 10) || 0;
    const generateId = () => 'ID-' + Math.random().toString(36).substr(2, 9);
    const getTodayDate = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

    // --- KOMPONEN UTAMA APLIKASI ---
    function App() {
      // Load Settings from LocalStorage initially
      const savedSettings = JSON.parse(localStorage.getItem(LS_KEYS.SETTINGS)) || { name: 'Keuangan Muas', theme: 'emerald', isDark: false };
      
      // 1. GLOBAL STATES
      const [activeTab, setActiveTab] = useState('dashboard');
      const [catatTrigger, setCatatTrigger] = useState(null); 
      
      const [appSettings, setAppSettings] = useState(savedSettings);
      const [toastMessage, setToastMessage] = useState(null);
      
      // Sinkronisasi States
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncQueueLength, setSyncQueueLength] = useState((JSON.parse(localStorage.getItem(LS_KEYS.QUEUE)) || []).length);
      const [isInitialLoad, setIsInitialLoad] = useState(true);

      // Data States (Default load dari LocalStorage)
      const [transactions, setTransactions] = useState(JSON.parse(localStorage.getItem(LS_KEYS.TX)) || []);
      const [debts, setDebts] = useState(JSON.parse(localStorage.getItem(LS_KEYS.DEBT)) || []);
      const [contacts, setContacts] = useState(JSON.parse(localStorage.getItem(LS_KEYS.CONTACT)) || []);
      const [selectedPerson, setSelectedPerson] = useState(null);

      // --- OFFLINE-FIRST LOGIC (LOCAL STORAGE WRAPPERS) ---
      const updateTransactions = (newTxData) => {
        setTransactions(newTxData);
        localStorage.setItem(LS_KEYS.TX, JSON.stringify(newTxData));
      };
      const updateDebts = (newDebtData) => {
        setDebts(newDebtData);
        localStorage.setItem(LS_KEYS.DEBT, JSON.stringify(newDebtData));
      };
      const updateContacts = (newContactData) => {
        setContacts(newContactData);
        localStorage.setItem(LS_KEYS.CONTACT, JSON.stringify(newContactData));
      };

      // --- BACKGROUND SYNC MANAGER ---
      const addToSyncQueue = (action, payload) => {
        const queue = JSON.parse(localStorage.getItem(LS_KEYS.QUEUE)) || [];
        const newItem = { qId: generateId(), action, payload };
        queue.push(newItem);
        localStorage.setItem(LS_KEYS.QUEUE, JSON.stringify(queue));
        setSyncQueueLength(queue.length);
        
        // Coba sync langsung jika online
        if(isOnline) processSyncQueue();
      };

      const processSyncQueue = async () => {
        if (!navigator.onLine || !GAS_URL || GAS_URL.includes("URL_GOOGLE") || isSyncing) return;
        
        let queue = JSON.parse(localStorage.getItem(LS_KEYS.QUEUE)) || [];
        if (queue.length === 0) return;

        setIsSyncing(true);
        let queueCopy = [...queue];

        for (let i = 0; i < queue.length; i++) {
          const item = queue[i];
          try {
            const response = await fetch(GAS_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: item.action, payload: item.payload })
            });
            const result = await response.json();
            if (result.status === 'success') {
              // Sukses, hapus dari antrean
              queueCopy = queueCopy.filter(q => q.qId !== item.qId);
              localStorage.setItem(LS_KEYS.QUEUE, JSON.stringify(queueCopy));
              setSyncQueueLength(queueCopy.length);
            } else { break; } // Stop jika API error logis
          } catch (err) {
            console.error('Sync error:', err);
            break; // Stop loop jika koneksi terputus saat proses
          }
        }
        setIsSyncing(false);
      };

      // --- FETCH DATA AWAL DARI CLOUD ---
      useEffect(() => {
        const fetchCloudData = async () => {
          if (!GAS_URL || GAS_URL.includes("URL_GOOGLE") || !navigator.onLine) {
            setIsInitialLoad(false); return;
          }
          
          // Jangan timpa data lokal jika masih ada antrean yg belum terkirim
          const pendingQueue = JSON.parse(localStorage.getItem(LS_KEYS.QUEUE)) || [];
          if (pendingQueue.length > 0) {
            await processSyncQueue(); // Kirim data lokal dulu
            if((JSON.parse(localStorage.getItem(LS_KEYS.QUEUE)) || []).length > 0) {
              setIsInitialLoad(false); return; // Jika gagal kirim, batalkan fetch agar tidak tertimpa
            }
          }

          fetch(GAS_URL)
            .then(res => res.json())
            .then(data => {
              if(data.transactions) updateTransactions(data.transactions.map(t => ({...t, amount: Number(t.amount)})));
              if(data.debts) updateDebts(data.debts.map(d => ({...d, amount: Number(d.amount)})));
              if(data.contacts) updateContacts(data.contacts);
              setIsInitialLoad(false);
            })
            .catch(err => {
              console.error(err);
              setIsInitialLoad(false);
            });
        };
        fetchCloudData();
      }, []);

      // --- LISTENER JARINGAN & TEMA ---
      useEffect(() => {
        const handleOnline = () => { setIsOnline(true); processSyncQueue(); showToast("Kembali Online!"); };
        const handleOffline = () => { setIsOnline(false); showToast("Mode Offline aktif"); };
        
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, [isOnline]);

      useEffect(() => {
        if (appSettings.isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        document.body.className = `theme-${appSettings.theme}`;
        
        // Update warna meta tag PWA berdasarkan tema
        const themeColors = { emerald: '#10b981', blue: '#3b82f6', purple: '#8b5cf6' };
        document.getElementById('meta-theme-color').content = appSettings.isDark ? '#111827' : themeColors[appSettings.theme];
      }, [appSettings]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Kalkulasi Dashboard
      const totalPemasukan = transactions.filter(t => t.type === 'in').reduce((acc, curr) => acc + curr.amount, 0);
      const totalPengeluaran = transactions.filter(t => t.type === 'out').reduce((acc, curr) => acc + curr.amount, 0);
      const saldoAktif = totalPemasukan - totalPengeluaran;
      const healthRatio = totalPemasukan > 0 ? Math.round((totalPengeluaran / totalPemasukan) * 100) : 0;


      // --- SUB-KOMPONEN ---

      const renderInitialLoading = () => {
        if (!isInitialLoad) return null;
        return e('div', { className: "absolute inset-0 bg-gray-50 dark:bg-gray-900 z-50 flex flex-col items-center justify-center animate-fade-in" },
          e('div', { className: "w-12 h-12 border-4 border-gray-200 rounded-full loader mb-4" }),
          e('p', { className: "text-gray-500 dark:text-gray-400 font-medium animate-pulse" }, "Memuat data lokal...")
        );
      };

      const renderToast = () => {
        if(!toastMessage) return null;
        return e('div', { className: "fixed top-4 left-1/2 -translate-x-1/2 z- transition-all animate-fade-in" },
          e('div', { className: "bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-2 text-sm font-medium whitespace-nowrap" },
            e(Icon, { name: "check", size: 18, className: "text-primary-400" }),
            toastMessage
          )
        );
      };

      // B. Halaman Dashboard
      const renderDashboard = () => {
        return e('div', { className: "p-4 space-y-6 pb-24 h-full overflow-y-auto no-scrollbar animate-fade-in" },
          e('div', { className: "flex justify-between items-center" },
            e('div', null,
              e('p', { className: "text-sm text-gray-500 dark:text-gray-400 flex items-center gap-1" }, 
                "Selamat datang,", 
                !isOnline ? e(Icon, { name: "cloudOff", size: 14, className: "text-red-500" }) : 
                isSyncing ? e(Icon, { name: "cloud", size: 14, className: "text-primary-500 animate-pulse" }) : null
              ),
              e('h1', { className: "text-xl font-bold text-gray-900 dark:text-white" }, appSettings.name)
            ),
            e('div', { className: "w-10 h-10 bg-primary-100 dark:bg-primary-900 rounded-full flex items-center justify-center text-primary-600 font-bold uppercase" }, appSettings.name.charAt(0))
          ),
          
          e('div', { className: "bg-gradient-to-br from-primary-500 to-primary-700 rounded-3xl p-6 text-white shadow-xl shadow-primary-200 dark:shadow-none relative overflow-hidden" },
            e('div', { className: "absolute -right-6 -top-6 w-32 h-32 bg-white opacity-10 rounded-full" }),
            e('div', { className: "absolute right-10 -bottom-10 w-24 h-24 bg-white opacity-10 rounded-full" }),
            e('p', { className: "text-primary-100 text-sm mb-1 relative z-10" }, "Total Saldo Tersedia"),
            e('h2', { className: "text-4xl font-extrabold tracking-tight mb-6 relative z-10" }, formatRp(saldoAktif)),
            e('div', { className: "grid grid-cols-2 gap-4 border-t border-primary-400/30 pt-4 relative z-10" },
              e('div', null,
                e('div', { className: "flex items-center text-primary-100 text-xs mb-1" }, e(Icon, { name: "arrowDown", size: 14, className: "mr-1" }), "Pemasukan"),
                e('p', { className: "font-semibold text-sm" }, formatRp(totalPemasukan))
              ),
              e('div', null,
                e('div', { className: "flex items-center text-red-200 text-xs mb-1" }, e(Icon, { name: "arrowUp", size: 14, className: "mr-1" }), "Pengeluaran"),
                e('p', { className: "font-semibold text-sm" }, formatRp(totalPengeluaran))
              )
            )
          ),

          e('div', { className: "bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-center gap-4" },
            e('div', { className: `p-3 rounded-full ${healthRatio < 70 ? 'bg-primary-100 text-primary-600 dark:bg-primary-900/50' : 'bg-red-100 text-red-600 dark:bg-red-900/50'}` }, e(Icon, { name: "pieChart", size: 24 })),
            e('div', { className: "flex-1" },
              e('h3', { className: "font-bold text-gray-900 dark:text-white text-sm" }, "Kesehatan Finansial"),
              e('div', { className: "w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 mt-2" },
                e('div', { className: `h-2 rounded-full ${healthRatio < 70 ? 'bg-primary-500' : 'bg-red-500'}`, style: { width: `${Math.min(healthRatio, 100)}%` } })
              ),
              e('p', { className: "text-xs text-gray-500 mt-1" }, `Pengeluaran memakan ${healthRatio}% pemasukan`)
            )
          ),

          e('div', { className: "grid grid-cols-2 gap-4" },
            e('button', { onClick: () => { setCatatTrigger('in'); setActiveTab('catat'); }, className: "bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 border border-gray-100 dark:border-gray-700 active:scale-95 transition-transform" },
              e('div', { className: "bg-primary-100 dark:bg-primary-900/50 p-3 rounded-full text-primary-600" }, e(Icon, { name: "plus", size: 24 })),
              e('span', { className: "text-sm font-medium text-gray-700 dark:text-gray-200" }, "Catat Masuk")
            ),
            e('button', { onClick: () => { setCatatTrigger('out'); setActiveTab('catat'); }, className: "bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 border border-gray-100 dark:border-gray-700 active:scale-95 transition-transform" },
              e('div', { className: "bg-red-100 dark:bg-red-900/50 p-3 rounded-full text-red-600" }, e(Icon, { name: "minus", size: 24 })),
              e('span', { className: "text-sm font-medium text-gray-700 dark:text-gray-200" }, "Catat Keluar")
            )
          ),

          e('div', null,
            e('div', { className: "flex justify-between items-center mb-4" },
              e('h3', { className: "font-bold text-gray-900 dark:text-white" }, "Transaksi Terakhir"),
              e('button', { onClick: () => setActiveTab('catat'), className: "text-primary-500 text-sm font-medium" }, "Lihat Semua")
            ),
            e('div', { className: "space-y-3" },
              transactions.length === 0 ? e('p', {className: "text-center text-sm text-gray-400 py-4"}, "Belum ada transaksi") :
              transactions.slice().reverse().slice(0, 5).map(t => 
                e('div', { key: t.id, onClick: () => { setActiveTab('catat'); }, className: "bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-700 flex justify-between items-center cursor-pointer active:scale-95 transition-transform" },
                  e('div', { className: "flex items-center gap-3" },
                    e('div', { className: `p-2 rounded-xl ${t.type === 'in' ? 'bg-primary-50 dark:bg-primary-950/40 text-primary-500' : 'bg-red-50 dark:bg-red-950/40 text-red-500'}` }, e(Icon, { name: t.type === 'in' ? 'arrowDown' : 'arrowUp', size: 18 })),
                    e('div', null, e('p', { className: "font-semibold text-gray-900 dark:text-white text-sm capitalize" }, t.note), e('p', { className: "text-[11px] text-gray-500 mt-0.5" }, t.date))
                  ),
                  e('div', { className: "text-right" }, e('p', { className: `font-bold text-sm ${t.type === 'in' ? 'text-primary-500' : 'text-red-500'}` }, `${t.type === 'in' ? '+' : '-'}${formatRp(t.amount)}`), e('p', { className: "text-[10px] text-gray-400 mt-0.5" }, t.type === 'in' ? 'Pemasukan' : 'Pengeluaran'))
                )
              )
            )
          )
        );
      };

      // C. Halaman Catat Transaksi
      const CatatComponent = () => {
        const [isFormOpen, setIsFormOpen] = useState(false);
        const [isEditMode, setIsEditMode] = useState(false);

              e('div', { className: "bg-primary-50 dark:bg-primary-900/20 p-4 rounded-2xl border border-primary-100 dark:border-primary-800/30" }, e('p', { className: "text-xs text-primary-600 dark:text-primary-400 font-medium" }, "Total Piutang (Uang Anda)"), e('p', { className: "text-lg font-bold text-primary-700 dark:text-primary-300 mt-1" }, formatRp(totalPiutangAll))),
              e('div', { className: "bg-red-50 dark:bg-red-900/20 p-4 rounded-2xl border border-red-100 dark:border-red-800/30" }, e('p', { className: "text-xs text-red-600 dark:text-red-400 font-medium" }, "Total Hutang (Harus Dibayar)"), e('p', { className: "text-lg font-bold text-red-700 dark:text-red-300 mt-1" }, formatRp(totalHutangAll)))
            ),
            e('h3', { className: "font-bold text-gray-900 dark:text-white mb-3" }, "Daftar Kontak"),
            e('div', { className: "space-y-3 pb-6" },
              contacts.map(person => {
                const net = personSummary[person.name] || 0;
                return e('div', { key: person.name, onClick: () => setSelectedPerson(person.name), className: "bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-700 flex justify-between items-center cursor-pointer active:scale-95 transition-all hover:border-primary-300 dark:hover:border-primary-700" }, e('div', { className: "flex items-center gap-4" }, e('div', { className: "w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center font-bold uppercase dark:text-white text-gray-500" }, person.name.charAt(0)), e('div', null, e('p', { className: "font-bold text-sm dark:text-white" }, person.name), e('p', { className: "text-[11px] text-gray-400 dark:text-gray-500 mt-0.5 font-medium" }, person.phone || "-"))), e('div', { className: "text-right" }, e('p', { className: `font-bold text-sm ${net > 0 ? 'text-primary-600' : net < 0 ? 'text-red-500' : 'text-gray-400'}` }, net === 0 ? 'Rp 0' : formatRp(Math.abs(net))), e('p', { className: "text-[10px] text-gray-500 font-medium mt-0.5" }, net > 0 ? 'Piutang' : net < 0 ? 'Hutang' : 'Lunas')));
              })
            )
          ),

          e('div', { className: "absolute bottom-16 left-0 w-full p-4 bg-gradient-to-t from-gray-50 via-gray-50 to-transparent dark:from-gray-900 dark:via-gray-900 z-40" },
            e('button', { onClick: () => setIsAddContactOpen(true), className: "w-full py-4 bg-primary-500 hover:bg-primary-600 active:scale-95 transition-all text-white font-extrabold rounded-2xl shadow-lg shadow-primary-100 dark:shadow-none flex items-center justify-center gap-2" }, e(Icon, { name: "plus", size: 20 }), "Tambah Kontak Baru")
          ),

          isAddContactOpen && e('div', { className: "fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in" },
            e('div', { className: "absolute inset-0", onClick: () => setIsAddContactOpen(false) }),
            e('div', { className: "w-full max-w-xs sm:max-w-sm bg-white dark:bg-gray-800 rounded-3xl p-6 shadow-2xl relative z-10 animate-fade-in" },
              e('div', { className: "flex justify-between items-center mb-5" }, e('h3', { className: "text-lg font-bold text-gray-900 dark:text-white" }, "Tambah Kontak Baru"), e('button', { onClick: () => setIsAddContactOpen(false), className: "text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-sm font-bold" }, "Batal")),
              e('form', { onSubmit: handleAddContactSubmit, className: "space-y-4" },
                e('div', null, e('label', { className: "text-xs text-gray-400 block mb-1 font-bold" }, "Nama Lengkap"), e('input', { type: "text", value: contactNameInput, onChange: ev => setContactNameInput(ev.target.value), placeholder: "Contoh: Ahmad Fauzi", className: "w-full bg-gray-50 dark:bg-gray-900 border-none p-3 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-primary-500 dark:text-white outline-none", required: true, autoFocus: true })),

                e('button', { type: "submit", className: "w-full py-3.5 mt-2 rounded-2xl text-white font-extrabold bg-primary-500 hover:bg-primary-600 shadow-md shadow-primary-200 dark:shadow-none active:scale-95 transition-transform text-sm" }, "Simpan Kontak")
              )
            )
          )
        );
      };

      // E. Halaman Settings Component
      const SettingsComponent = () => {
        const [tempName, setTempName] = useState(appSettings.name);
        const [tempTheme, setTempTheme] = useState(appSettings.theme);
        const [tempIsDark, setTempIsDark] = useState(appSettings.isDark);
        const fileInputRef = useRef(null);

        const handleSaveSettings = () => {
          const newSettings = { name: tempName, theme: tempTheme, isDark: tempIsDark };
          setAppSettings(newSettings);
          localStorage.setItem(LS_KEYS.SETTINGS, JSON.stringify(newSettings));
          showToast("Pengaturan Disimpan!");
        };

        const handleExportJSON = () => {
          const exportData = { transactions, debts, contacts, settings: appSettings };
          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData));
          const el = document.createElement('a');
          el.setAttribute("href", dataStr);
          el.setAttribute("download", `Backup_KeuanganKu_${getTodayDate()}.json`);
          document.body.appendChild(el);
          el.click();
          el.remove();
          showToast("Data Berhasil Diexport!");
        };

        const handleImportJSON = (ev) => {
          const file = ev.target.files;
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const imported = JSON.parse(e.target.result);
              if (imported.transactions) updateTransactions(imported.transactions);
              if (imported.debts) updateDebts(imported.debts);
              if (imported.contacts) updateContacts(imported.contacts);
              if (imported.settings) {
                setAppSettings(imported.settings);
                localStorage.setItem(LS_KEYS.SETTINGS, JSON.stringify(imported.settings));
              }
              showToast("Data Berhasil Di-Restore!");
              // Note: Dalam real app, kita juga butuh push data massal ke cloud (di luar scope single api).
            } catch (err) { alert("Format file tidak valid!"); }
          };
          reader.readAsText(file);
        };

        return e('div', { className: "p-4 pb-24 h-full overflow-y-auto no-scrollbar animate-fade-in" },
          e('h2', { className: "text-2xl font-bold text-gray-900 dark:text-white mb-6" }, "Pengaturan"),
          
          // Form Setting Utama
          e('div', { className: "bg-white dark:bg-gray-800 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 p-5 mb-6 space-y-5" },
            e('div', null,
                e('label', { className: "text-xs text-gray-500 block mb-2 font-medium" }, "Nama Profil"),
                e('input', { type: "text", value: tempName, onChange: ev => setTempName(ev.target.value), className: "w-full bg-gray-50 dark:bg-gray-900 px-4 py-3 rounded-xl font-bold focus:outline-none focus:ring-2 focus:ring-primary-500 dark:text-white" })
            ),
            e('div', { className: "flex justify-between items-center" },
              e('div', { className: "flex items-center gap-3 dark:text-gray-200" }, e(Icon, { name: tempIsDark ? 'moon' : 'sun', size: 22, className: tempIsDark ? 'text-indigo-400' : 'text-amber-500' }), e('span', { className: "font-medium text-sm" }, "Mode Gelap")),

                e('div', { className: `w-5 h-5 bg-white rounded-full absolute top-0.5 transition-transform ${tempIsDark ? 'translate-x-6' : 'translate-x-0.5'}` })
              )
            ),
            e('div', null,
              e('label', { className: "text-xs text-gray-500 block mb-3 font-medium" }, "Warna Tema"),
              e('div', { className: "flex gap-3" },
                e('button', { onClick: () => setTempTheme('emerald'), className: `w-10 h-10 rounded-full bg-[#10b981] ${tempTheme === 'emerald' ? 'ring-4 ring-emerald-200 dark:ring-emerald-900' : ''}` }),
                e('button', { onClick: () => setTempTheme('blue'), className: `w-10 h-10 rounded-full bg-[#3b82f6] ${tempTheme === 'blue' ? 'ring-4 ring-blue-200 dark:ring-blue-900' : ''}` }),
                e('button', { onClick: () => setTempTheme('purple'), className: `w-10 h-10 rounded-full bg-[#8b5cf6] ${tempTheme === 'purple' ? 'ring-4 ring-purple-200 dark:ring-purple-900' : ''}` })
              )
            ),
            e('button', { onClick: handleSaveSettings, className: "w-full py-3 bg-primary-500 text-white font-bold rounded-xl active:scale-95 transition-transform" }, "Simpan Pengaturan")
          ),

          // Status & Data Management
          e('div', { className: "bg-white dark:bg-gray-800 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden mb-6" },
            // Network Status Info
            e('div', { className: "p-5 border-b border-gray-50 dark:border-gray-700 flex items-center justify-between" }, 
              e('div', { className: "flex items-center gap-3 dark:text-gray-200" }, 
                e(Icon, { name: isOnline ? "cloud" : "cloudOff", size: 22, className: isOnline ? "text-primary-500" : "text-gray-400" }), 
                e('div', null, e('span', { className: "font-bold text-sm block" }, isOnline ? "Online (Tersambung)" : "Offline Mode"), e('span', { className: "text-[10px] text-gray-500" }, syncQueueLength > 0 ? `${syncQueueLength} data mengantre sinkronisasi` : "Semua data sinkron"))
              ),
              syncQueueLength > 0 && isOnline && !isSyncing && e('button', { onClick: processSyncQueue, className: "text-xs font-bold text-primary-500 bg-primary-50 px-2 py-1 rounded-md" }, "Sync")
            ),
            // Export / Import
            e('div', { onClick: handleExportJSON, className: "p-5 border-b border-gray-50 dark:border-gray-700 flex items-center gap-3 cursor-pointer active:bg-gray-50 dark:active:bg-gray-700" },
              e(Icon, { name: "download", size: 22, className: "text-primary-500" }), e('span', { className: "font-medium text-sm dark:text-white" }, "Backup / Export JSON")
            ),
            e('div', { onClick: () => fileInputRef.current.click(), className: "p-5 flex items-center gap-3 cursor-pointer active:bg-gray-50 dark:active:bg-gray-700" },
              e(Icon, { name: "upload", size: 22, className: "text-orange-500" }), e('span', { className: "font-medium text-sm dark:text-white" }, "Restore / Import JSON"),
              e('input', { type: "file", accept: ".json", ref: fileInputRef, onChange: handleImportJSON, className: "hidden" })
            )
          )
        );
      };

      // Navigasi Bawah
      const NavButton = ({ tabId, iconName, label, onClickOverride }) => {
        const isActive = activeTab === tabId;
        return e('button', { onClick: onClickOverride || (() => setActiveTab(tabId)), className: `flex flex-col items-center p-2 transition-colors ${isActive ? 'text-primary-500' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}` }, e(Icon, { name: iconName, size: 22 }), e('span', { className: "text-[10px] mt-1 font-medium" }, label));
      };

      // F. RENDER UTAMA ROOT DIV
      return e('div', { className: "w-full h-screen max-w-md mx-auto relative flex flex-col bg-gray-50 dark:bg-gray-900 shadow-2xl overflow-hidden font-sans" },
        renderInitialLoading(),
        renderToast(),
        
        e('div', { className: "flex-1 overflow-hidden relative" },
          activeTab === 'dashboard' ? renderDashboard() : null,
          activeTab === 'catat' ? e(CatatComponent) : null,
          activeTab === 'hutang' ? e(HutangComponent) : null,
          activeTab === 'settings' ? e(SettingsComponent) : null

        e('nav', { className: "absolute bottom-0 w-full bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 pb-safe pt-2 px-6 flex justify-between items-center z-50" },
          e(NavButton, { tabId: 'dashboard', iconName: 'home', label: 'Beranda', onClickOverride: () => {setActiveTab('dashboard'); setSelectedPerson(null);} }),

          e(NavButton, { tabId: 'settings', iconName: 'settings', label: 'Setelan', onClickOverride: () => {setActiveTab('settings'); setSelectedPerson(null);} })

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
