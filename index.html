<!DOCTYPE html>
<html lang="id">
<head>

    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    body { margin: 0; padding: 0; background-color: #f3f4f6; overflow: hidden; -webkit-tap-highlight-color: transparent; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .loader { border-top-color: var(--p-500); -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

</head>
<body>

  <div id="root"></div>

  <script>
    // ========================================================
    // KONFIGURASI DATABASE GOOGLE APPS SCRIPT
    // ========================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxwjUOCFw2fR_Kq2Md1KzKNG93Nqqe1JFjj9_lGqXgZZgzyDd48AU6EXWD04nTTVCnGAA/exec";

    const e = React.createElement;
    const { useState, useEffect, useMemo, useRef } = React;

    const Icon = ({ name, size = 24, className = "" }) => {

        chevronLeft: "M15 19l-7-7 7-7",
        sun: "M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z",
        moon: "M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z",
        cloud: "M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z",
        check: "M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z",
        pieChart: "M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z|M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z",
        calendar: "M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z",
        fileJson: "M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
      };
      const pathStrings = paths[name] ? paths[name].split('|') : [];
      return e('svg', { className, width: size, height: size, fill: "none", viewBox: "0 0 24 24", stroke: "currentColor" },
        pathStrings.map((d, i) => e('path', { key: i, strokeLinecap: "round", strokeLinejoin: "round", strokeWidth: 2, d }))
      );
    };

    const formatRp = (angka) => 'Rp ' + new Intl.NumberFormat('id-ID').format(angka || 0);
    const formatNumberInput = (val) => {
      if (!val) return '';
      // Hapus karakter non-digit, lalu format pakai titik
      return val.toString().replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    };
    const generateId = () => 'ID-' + Math.random().toString(36).substr(2, 9);
    const getTodayDate = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    // ========================================================
    // MAIN APP COMPONENT
    // ========================================================
    function App() {
      // 1. GLOBAL STATES
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [themeColor, setThemeColor] = useState('hijau');
      const [accountName, setAccountName] = useState('Budi Setiawan');
      const [toastMessage, setToastMessage] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);
      const [isInitialLoad, setIsInitialLoad] = useState(true);

      // Data States
      const [transactions, setTransactions] = useState([]);
      const [debts, setDebts] = useState([]);
      const [contacts, setContacts] = useState([]);
      const [selectedPerson, setSelectedPerson] = useState(null);

      useEffect(() => {
        if (!GAS_URL || GAS_URL.includes("URL_GOOGLE")) {
          // Dummy data untuk preview
          setTransactions([
            { id: '1', type: 'in', amount: 5000000, date: getTodayDate(), note: 'Gaji Bulan Ini' },
            { id: '2', type: 'out', amount: 150000, date: getTodayDate(), note: 'Makan siang bareng teman' },
          ]);
          setDebts([
            { id: '1', person: 'Andi', type: 'piutang', amount: 200000, date: getTodayDate(), note: 'Bayar makan' },
            { id: '2', person: 'Siska', type: 'hutang', amount: 500000, date: '2026-05-12', note: 'Servis motor' }
          ]);
          setContacts([{ name: 'Andi', phone: '081234567890' }, { name: 'Siska', phone: '089876543210' }]);
          setIsInitialLoad(false);
          return;
        }

        fetch(GAS_URL)
          .then(res => res.json())
          .then(data => {
            if(data.transactions) setTransactions(data.transactions.map(t => ({...t, amount: Number(t.amount)})));
            if(data.debts) setDebts(data.debts.map(d => ({...d, amount: Number(d.amount)})));
            if(data.contacts) setContacts(data.contacts);
            setIsInitialLoad(false);
          })
          .catch(err => {
            console.error(err);
            showToast("Gagal mengambil data Cloud. Mode Lokal Aktif.");
            setIsInitialLoad(false);
          });
      }, []);

      const syncToCloud = async (action, payload) => {
        if (!GAS_URL || GAS_URL.includes("URL_GOOGLE")) return;
        setIsSyncing(true);
        try {
          await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, payload })
          });
        } catch (err) {
          console.error(err);
        } finally {
          setIsSyncing(false);
        }
      };

      // Effect Sinkronisasi Tema Warna
      useEffect(() => {
        const palettes = {
          hijau: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b', 950: '#022c22' },
          biru: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a', 950: '#172554' },
          ungu: { 50: '#faf5ff', 100: '#f3e8ff', 200: '#e9d5ff', 300: '#d8b4fe', 400: '#c084fc', 500: '#a855f7', 600: '#9333ea', 700: '#7e22ce', 800: '#6b21a8', 900: '#581c87', 950: '#3b0764' }
        };
        const colors = palettes[themeColor] || palettes.hijau;
        for (const [key, val] of Object.entries(colors)) {
          document.documentElement.style.setProperty(`--p-${key}`, val);
        }
      }, [themeColor]);

      useEffect(() => {
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDarkMode]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const totalPemasukan = transactions.filter(t => t.type === 'in').reduce((acc, curr) => acc + curr.amount, 0);
      const totalPengeluaran = transactions.filter(t => t.type === 'out').reduce((acc, curr) => acc + curr.amount, 0);
      const saldoAktif = totalPemasukan - totalPengeluaran;
      const healthRatio = totalPemasukan > 0 ? Math.round((totalPengeluaran / totalPemasukan) * 100) : 0;

      // --- SUB-KOMPONEN ---

      const renderToast = () => {
        if(!toastMessage) return null;
        return e('div', { className: "fixed top-4 left-1/2 -translate-x-1/2 z-[60] transition-all animate-fade-in" },
          e('div', { className: "bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-2 text-sm font-medium whitespace-nowrap" },
            e(Icon, { name: "check", size: 18, className: "text-emerald-400" }), toastMessage
          )
        );
      };

      const renderInitialLoading = () => {
        if (!isInitialLoad) return null;
        return e('div', { className: "absolute inset-0 bg-gray-50 dark:bg-gray-900 z-50 flex flex-col items-center justify-center animate-fade-in" },
          e('div', { className: "w-12 h-12 border-4 border-emerald-500 rounded-full loader mb-4" }),
          e('p', { className: "text-gray-500 dark:text-gray-400 font-medium animate-pulse" }, "Mengambil data...")
        );
      };

      const renderDashboard = () => {
        return e('div', { className: "p-4 space-y-6 pb-24 h-full overflow-y-auto no-scrollbar animate-fade-in" },
          e('div', { className: "flex justify-between items-center" },
            e('div', null,
              e('p', { className: "text-sm text-gray-500 dark:text-gray-400 flex items-center gap-1" }, "Selamat datang,", isSyncing && e(Icon, { name: "cloud", size: 14, className: "text-emerald-500 animate-pulse" })),
              e('h1', { className: "text-xl font-bold text-gray-900 dark:text-white" }, accountName)
            ),
            e('div', { className: "w-10 h-10 bg-emerald-100 dark:bg-emerald-900 rounded-full flex items-center justify-center text-emerald-600 font-bold uppercase" }, accountName.charAt(0))
          ),
          
          e('div', { className: "bg-gradient-to-br from-emerald-500 to-emerald-700 rounded-3xl p-6 text-white shadow-xl shadow-emerald-200 dark:shadow-none relative overflow-hidden" },
            e('div', { className: "absolute -right-6 -top-6 w-32 h-32 bg-white opacity-10 rounded-full" }),
            e('div', { className: "absolute right-10 -bottom-10 w-24 h-24 bg-white opacity-10 rounded-full" }),
            e('p', { className: "text-emerald-100 text-sm mb-1 relative z-10" }, "Total Saldo Tersedia"),
            e('h2', { className: "text-4xl font-extrabold tracking-tight mb-6 relative z-10" }, formatRp(saldoAktif)),
            e('div', { className: "grid grid-cols-2 gap-4 border-t border-emerald-400/30 pt-4 relative z-10" },
              e('div', null, e('div', { className: "flex items-center text-emerald-100 text-xs mb-1" }, e(Icon, { name: "arrowDown", size: 14, className: "mr-1" }), "Pemasukan"), e('p', { className: "font-semibold text-sm" }, formatRp(totalPemasukan))),
              e('div', null, e('div', { className: "flex items-center text-red-200 text-xs mb-1" }, e(Icon, { name: "arrowUp", size: 14, className: "mr-1" }), "Pengeluaran"), e('p', { className: "font-semibold text-sm" }, formatRp(totalPengeluaran)))
            )
          ),

          e('div', { className: "bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-center gap-4" },
            e('div', { className: `p-3 rounded-full ${healthRatio < 70 ? 'bg-emerald-100 text-emerald-600 dark:bg-emerald-900/50' : 'bg-red-100 text-red-600 dark:bg-red-900/50'}` }, e(Icon, { name: "pieChart", size: 24 })),
            e('div', { className: "flex-1" },
              e('h3', { className: "font-bold text-gray-900 dark:text-white text-sm" }, "Kesehatan Finansial"),
              e('div', { className: "w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 mt-2" }, e('div', { className: `h-2 rounded-full ${healthRatio < 70 ? 'bg-emerald-500' : 'bg-red-500'}`, style: { width: `${Math.min(healthRatio, 100)}%` } })),
              e('p', { className: "text-xs text-gray-500 mt-1" }, `Pengeluaran memakan ${healthRatio}% pemasukan`)
            )
          ),

          e('div', { className: "grid grid-cols-2 gap-4" },
            e('button', { onClick: () => setActiveTab('catat'), className: "bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 border border-gray-100 dark:border-gray-700 active:scale-95 transition-transform" }, e('div', { className: "bg-emerald-100 dark:bg-emerald-900/50 p-3 rounded-full text-emerald-600" }, e(Icon, { name: "plus", size: 24 })), e('span', { className: "text-sm font-medium text-gray-700 dark:text-gray-200" }, "Catat Masuk")),
            e('button', { onClick: () => setActiveTab('catat'), className: "bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-2 border border-gray-100 dark:border-gray-700 active:scale-95 transition-transform" }, e('div', { className: "bg-red-100 dark:bg-red-900/50 p-3 rounded-full text-red-600" }, e(Icon, { name: "minus", size: 24 })), e('span', { className: "text-sm font-medium text-gray-700 dark:text-gray-200" }, "Catat Keluar"))
          ),

          e('div', null,
            e('div', { className: "flex justify-between items-center mb-4" }, e('h3', { className: "font-bold text-gray-900 dark:text-white" }, "Transaksi Terakhir"), e('button', { onClick: () => setActiveTab('catat'), className: "text-emerald-500 text-sm font-medium" }, "Lihat Semua")),
            e('div', { className: "space-y-3" },
              transactions.length === 0 ? e('p', {className: "text-center text-sm text-gray-400 py-4"}, "Belum ada transaksi") :
              transactions.slice().reverse().slice(0, 5).map(t => 
                e('div', { key: t.id, className: "bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-50 dark:border-gray-700 flex justify-between items-center" },
                  e('div', { className: "flex items-center gap-4" },
                    e('div', { className: `p-2 rounded-xl ${t.type === 'in' ? 'bg-emerald-100 text-emerald-600 dark:bg-emerald-900/50' : 'bg-red-100 text-red-600 dark:bg-red-900/50'}` }, e(Icon, { name: t.type === 'in' ? 'arrowDown' : 'arrowUp', size: 20 })),
                    e('div', null, e('p', { className: "font-semibold text-gray-900 dark:text-white" }, t.note), e('p', { className: "text-xs text-gray-500 mt-0.5" }, t.date))
                  ),
                  e('div', { className: "text-right" },
                    e('p', { className: `font-bold ${t.type === 'in' ? 'text-emerald-600' : 'text-red-500'}` }, `${t.type === 'in' ? '+' : '-'}${formatRp(t.amount)}`),
                    e('p', { className: "text-[10px] text-gray-400 mt-0.5" }, t.type === 'in' ? 'Pemasukan' : 'Pengeluaran')
                  )
                )
              )
            )
          )
        );
      };

      const CatatComponent = () => {
        const [isFormOpen, setIsFormOpen] = useState(false);
        const [editTx, setEditTx] = useState(null); // Menyimpan state data yang mau diedit
        
        const [formType, setFormType] = useState('out');
        const [amount, setAmount] = useState('');
        const [date, setDate] = useState(getTodayDate());
        const [note, setNote] = useState('');

        const [timeFilter, setTimeFilter] = useState('semua');
        const [showRangeModal, setShowRangeModal] = useState(false);
        const [startDate, setStartDate] = useState('');
        const [endDate, setEndDate] = useState('');

        const handleSave = (eEvent) => {
          eEvent.preventDefault();
          // Bersihkan titik sebelum disimpan
          const parsedAmount = parseInt(amount.toString().replace(/\./g, ''), 10);
          if (!parsedAmount || !note) {
            alert("Nominal dan Catatan wajib diisi!");
            return;
          }
          const newTx = { id: generateId(), type: formType, amount: parsedAmount, date, note };
          
          setTransactions([...transactions, newTx]);
          syncToCloud('addTransaction', newTx);
          
          setAmount(''); setNote(''); setDate(getTodayDate());
          setIsFormOpen(false);
          showToast("Transaksi berhasil dicatat!");
        };

        const handleUpdateTx = (ev) => {
          ev.preventDefault();
          const parsedAmount = parseInt(editTx.amount.toString().replace(/\./g, ''), 10);
          if (!parsedAmount || !editTx.note) return;
          const updatedTx = { ...editTx, amount: parsedAmount };
          
          setTransactions(transactions.map(t => t.id === updatedTx.id ? updatedTx : t));
          syncToCloud('editTransaction', updatedTx);
          
          setEditTx(null);
          showToast("Transaksi diperbarui!");
        };

        const handleDeleteTx = (id) => {
          setTransactions(transactions.filter(t => t.id !== id));
          syncToCloud('deleteTransaction', { id });
          setEditTx(null);
          showToast("Transaksi dihapus!");
        };

        const filteredTx = useMemo(() => {
          return transactions.filter(t => {
            if (timeFilter === 'harian') return new Date(t.date).toDateString() === new Date().toDateString();
            if (timeFilter === 'mingguan') return Math.abs(new Date() - new Date(t.date)) / 86400000 <= 7;
            if (timeFilter === 'bulanan') return new Date(t.date).getMonth() === new Date().getMonth() && new Date(t.date).getFullYear() === new Date().getFullYear();
            if (timeFilter === 'tahunan') return new Date(t.date).getFullYear() === new Date().getFullYear();
            if (timeFilter === 'kustom' && startDate && endDate) {
              const d = new Date(t.date); const s = new Date(startDate); const e = new Date(endDate);
              d.setHours(0,0,0,0); s.setHours(0,0,0,0); e.setHours(0,0,0,0);
              return d >= s && d <= e;
            }
            return true;
          }).reverse();
        }, [transactions, timeFilter, startDate, endDate]);

        const handleApplyCustomRange = (ev) => {
          ev.preventDefault();
          if (startDate && endDate) { setTimeFilter('kustom'); setShowRangeModal(false); }
        };

        return e('div', { className: "h-full flex flex-col relative bg-gray-50 dark:bg-gray-900 animate-fade-in" },
          
          e('div', { className: "p-4 flex justify-between items-center border-b border-gray-100 dark:border-gray-800" },
            e('div', null, e('h2', { className: "text-2xl font-bold text-gray-900 dark:text-white" }, "Buku Kas"), e('p', { className: "text-xs text-gray-500 capitalize" }, `Filter: ${timeFilter === 'kustom' ? `${startDate} s/d ${endDate}` : timeFilter}`)),
            e('button', { onClick: () => setShowRangeModal(true), className: "p-2 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 text-gray-600 dark:text-gray-300 active:scale-95 transition-transform" }, e(Icon, { name: "calendar", size: 22 }))
          ),

          e('div', { className: "flex-1 overflow-y-auto no-scrollbar px-4 pb-36" },
